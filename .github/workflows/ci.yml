name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read            # least privilege: CI never writes to the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Build C++ kernels (+ C++ tests)
        run: |
          cmake -S csrc -B csrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build csrc/build -j
          ./csrc/build/test_kernels
      - name: C++ tests under AddressSanitizer + UBSan
        run: |
          cmake -S csrc -B csrc/build-asan -DCMAKE_BUILD_TYPE=Debug -DINFERLAB_SANITIZE=ON
          cmake --build csrc/build-asan -j
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ./csrc/build-asan/test_kernels
      - name: Python tests
        run: pytest
      - name: Lint (ruff)
        run: ruff check inferlab tests labs benchmarks scripts
      - name: Static security analysis (bandit)
        run: bandit -q -r inferlab labs benchmarks scripts -c pyproject.toml
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --strict
      - name: Labs run end-to-end
        run: for f in labs/[0-9]*.py; do python "$f" > /dev/null || exit 1; done

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (runs C++ kernel tests inside)
        run: docker build -t inferlab:ci .
      - name: Smoke test (non-root, read-only filesystem)
        run: |
          mkdir -p secrets && chmod 700 secrets
          python3 -c "import secrets; print('il-' + secrets.token_urlsafe(32))" > secrets/api_keys.txt
          chmod 644 secrets/api_keys.txt
          docker run -d --name il --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e INFERLAB_API_KEYS_FILE=/run/secrets/keys -v "$PWD/secrets/api_keys.txt:/run/secrets/keys:ro" \
            -p 127.0.0.1:8000:8000 inferlab:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/readyz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/models)" = "401"
          curl -sf http://127.0.0.1:8000/v1/completions -H "Authorization: Bearer $(cat secrets/api_keys.txt)" \
            -H "Content-Type: application/json" -d '{"prompt":"Hello","max_tokens":8}'
          test "$(docker exec il id -u)" = "10001"
          docker rm -f il
