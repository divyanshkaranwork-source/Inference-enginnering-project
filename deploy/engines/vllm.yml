# vLLM serving Llama-2-7B-chat behind the InferLab gateway.
#   docker compose -f deploy/engines/vllm.yml up
services:
  engine:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.1}   # pin by digest for production
    command:
      - --model=meta-llama/Llama-2-7b-chat-hf
      - --max-model-len=4096
      - --gpu-memory-utilization=0.90
      - --enable-prefix-caching
      - --max-num-seqs=64
      # - --quantization=fp8          # H100/L40S: halve weight bytes
      # - --kv-cache-dtype=fp8        # halve KV-cache bytes
      # - --tensor-parallel-size=2    # shard across 2 GPUs
    entrypoint: ["/bin/sh", "-c", "HF_TOKEN=$$(cat /run/secrets/hf_token) exec vllm serve \"$$@\"", "--"]
    secrets: [hf_token]
    volumes: ["./hf-cache:/root/.cache/huggingface"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    expose: ["8000"]                  # internal network only

  gateway:
    build: ../..
    environment:
      INFERLAB_BACKEND: vllm
      INFERLAB_UPSTREAM_URL: http://engine:8000
      INFERLAB_UPSTREAM_MODEL: meta-llama/Llama-2-7b-chat-hf
      INFERLAB_API_KEYS_FILE: /run/secrets/inferlab_api_keys
      INFERLAB_MODEL: tiny-random     # the lab pages use a small local model
    secrets: [inferlab_api_keys]
    ports: ["127.0.0.1:9000:8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [engine]

secrets:
  hf_token: { file: ../../secrets/hf_token.txt }
  inferlab_api_keys: { file: ../../secrets/api_keys.txt }
